---
include:
  - board: halcyon_wireless//zmk
    shield: halcyon_elora_left mod_battery_lipo mod_display_epaper_mountain
    artifact-name: halcyon_elora_left_lipo_epaper_mountain
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

  - board: halcyon_wireless//zmk
    shield: halcyon_elora_right mod_battery_lipo mod_display_epaper_cityscape
    artifact-name: halcyon_elora_right_lipo_epaper_cityscape
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  # One-time settings reset for both wireless controllers.
  - board: halcyon_wireless//zmk
    shield: settings_reset
    artifact-name: settings_reset_halcyon_wireless
