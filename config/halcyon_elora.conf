# Settings for both halves.

# Layer lighting from this repository's module replaces SplitKB's stock RGB
# renderer. It switches the LED supply pin itself, so the ext-power driver,
# which would restore and save its own supply state, is off.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_EXT_POWER=n
CONFIG_ELORA_LIGHTING=y
