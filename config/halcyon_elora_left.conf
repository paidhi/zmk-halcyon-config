# Release shortcut keys before their implicit modifiers, including Ctrl+Right.
CONFIG_ZMK_HID_SEPARATE_MOD_RELEASE_REPORT=y

# Refresh the left e-paper more promptly after layer and status changes.
# The display shield config uses 1000 ms; this override costs extra idle
# wakeups but no extra refreshes when nothing is invalidated.
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=250
